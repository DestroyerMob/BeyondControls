name: Build Beyond Controls

on:
  push:
  pull_request:

jobs:
  build-neoforge-1-21-1:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Select NeoForge 1.21.1
        run: printf '%s' '1.21.1-neoforge' > versions/current

      - name: Prepare NeoForge 1.21.1 source
        run: ./gradlew "Refresh active project"
        env:
          CI_SINGLE_BUILD: 1.21.1-neoforge:1.21.1

      - name: Build NeoForge 1.21.1
        run: ./gradlew buildAndCollectActive --stacktrace
        env:
          CI_SINGLE_BUILD: 1.21.1-neoforge:1.21.1

      - uses: actions/upload-artifact@v4
        with:
          name: beyond-controls-neoforge-1.21.1
          path: build/finalJars/*.jar
